name: Build

# Every push runs the checks and builds the Windows installer.
# Every push to main also publishes a GitHub release, which installed copies
# pick up through auto-update. The version is <major>.<minor> from package.json
# plus a patch number equal to the commit count on main, so each release is
# newer than the last without anyone bumping it by hand.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          patch=$(git rev-list --count HEAD)
          echo "version=$base.$patch" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building $base.$patch (release: $GITHUB_REF)"

  test:
    name: Check (Linux)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Smoke test the built app
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run smoke:ci

  windows:
    name: Package (Windows)
    runs-on: windows-latest
    needs: [version, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Smoke test the built app on Windows
        run: npm run smoke:ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: malevo-science-windows-${{ needs.version.outputs.version }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [version, windows]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Malevo Science ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          # electron-updater reads latest.yml from the newest release's assets.
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
